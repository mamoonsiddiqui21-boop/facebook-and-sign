<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left {
            width: 52%;
            padding-left: 20px;
        }

        .logo {
            color: #1877f2;
            font-size: 68px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            font-size: 28px;
            line-height: 1.3;
            color: #272829;
            max-width: 600px;
        }

        .login-box {
            width: 410px;
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
        }

        input {
            width: 100%;
            height: 58px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            margin-bottom: 18px;
            padding: 0 18px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #1877f2;
        }

        .login-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 6px;
            background-color: #1877f2;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            text-align: center;
            margin: 22px 0 28px;
            color: #1877f2;
            text-decoration: none;
            font-size: 16px;
        }

        .line {
            height: 1px;
            background-color: #ddd;
            margin-bottom: 28px;
        }

        .create-btn {
            display: block;
            margin: auto;
            padding: 17px 28px;
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

@media (max-width: 800px)   {
            body {
                padding: 30px 15px;
            }

            .container {
                width: 100%;
                flex-direction: column;
                text-align: center;
                gap: 35px;
            }

            .left {
                width: 100%;
                padding: 0;
            }

            .logo {
                font-size: 55px;
            }

            .description {
                font-size: 21px;
                margin: auto;
            }

            .login-box {
                width: 100%;
                max-width: 410px;
            }
}
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <h1 class="logo">facebook</h1>

            <p class="description">
                Connect with friends and the world
                around you on Facebook.
            </p>
        </div>


       
        <div class="login-box">

            <form>
                <input
                    type="text"
                    placeholder="Email or phone number"
                >

                <input
                    type="password"
                    placeholder="Password"
                >

                <button class="login-btn" type="submit">
                    Login
                </button>

                <a href="sign.html" class="forgot">
                    Forgot password?
                </a>

                <div class="line"></div>

                <button class="create-btn" type="button">
                    Create new account
                </button>
            </form>

        </div>

    </div>

</body>
</html>
