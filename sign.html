<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .left {
            width: 50%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signin-box {
            width: 75%;
            max-width: 570px;
            text-align: center;
        }

        .signin-box h1 {
            font-size: 55px;
            margin-bottom: 35px;
            color: #111;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 30px;
        }

        .social span {
            width: 55px;
            height: 55px;
            border: 1px solid #eee;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        .facebook {
            color: #1877f2;
        }

        .google {
            color: #db4437;
        }

        .linkedin {
            color: #0077b5;
        }

        .or {
            color: #777;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input {
            width: 100%;
            height: 65px;
            border: none;
            outline: none;
            background: #c7c7c7;
            margin-bottom: 25px;
            padding: 0 25px;
            font-size: 20px;
            border-radius: 10px;
        }

        .forgot {
            color: #555;
            font-size: 22px;
            margin: 20px 0 30px;
        }

        .signin-btn {
            width: 290px;
            height: 65px;
            border: none;
            border-radius: 40px;
            background: #ff4b20;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .right {
            width: 50%;
            height: 100%;
            background: #ff3028;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .welcome {
            width: 75%;
        }

        .welcome h1 {
            font-size: 55px;
            margin-bottom: 30px;
        }

        .welcome p {
            font-size: 25px;
            line-height: 1.5;
            margin-bottom: 50px;
        }
       
        .signup-btn {
    width: 300px;
    height: 65px;
    border: 2px solid white;
    border-radius: 40px;
    background: transparent;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    display: inline-flex;
    justify-content: center;
    align-items: center;
}


        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .left,
            .right {
                width: 100%;
                min-height: 100vh;
            }

            .signin-box,
            .welcome {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">

            <div class="signin-box">

                <h1>Sign in</h1>

                <div class="social">
                    <span class="facebook">f</span>
                    <span class="google">G+</span>
                    <span class="linkedin">in</span>
                </div>

                <p class="or">or use your account</p>

                <input 
                    type="email" 
                    class="input" 
                    placeholder="Email"
                >

                <input 
                    type="password" 
                    class="input" 
                    placeholder="Password"
                >

                <p class="forgot">Forgot your password?</p>

                <button class="signin-btn">
                    SIGN IN
                </button>

            </div>

        </div>


        <div class="right">

            <div class="welcome">

                <h1>Hello, Friend!</h1>

                <p>
                    Enter your personal details and start
                    <br>
                    journey with us
                </p>

                
                    <a href="facebook.html"class="signup-btn">SIGN UP</a>
                

            </div>

        </div>

    </div>

</body>
</html>
